<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Help Desk</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        form { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .btn-cancel { background: #6c757d; display: none; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .badge { padding: 3px 8px; border-radius: 3px; color: white; font-size: 0.8em; }
        .High { background: red; } .Medium { background: orange; } .Low { background: green; }
        .actions { margin-top: 10px; }
        .btn-edit { background: #ffc107; color: black; }
        .btn-delete { background: #dc3545; }
    </style>
</head>
<body>

    <center><h2>Campus Help Desk</h2></center>

    <form id="requestForm">
        <input type="hidden" id="requestId">
        
        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="studentName" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Academic">Academic</option>
                <option value="Hostel">Hostel</option>
                <option value="IT Support">IT Support</option>
                <option value="Library">Library</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Problem Description</label>
            <textarea id="description" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label>Priority</label>
            <select id="priority" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">Submit Request</button>
        <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">Cancel Edit</button>
    </form>

    <h3>Submitted Requests</h3>
    <div id="requestsList"></div>

    <script src="app.js"></script>
</body>
</html>
